services:
  mcp:
    build:
      context: ..
      dockerfile: langtools-mcp/docker-mcp/Dockerfile
    container_name: langtools-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      # Set API keys via environment variables or .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LANGTOOLS_DEBUG=${LANGTOOLS_DEBUG:-false}
      # Configure API URL for Docker container networking
      # - LANGTOOLS_API_URL=http://langtools-api:8000
    volumes:
      - ..:/workspace-root
    working_dir: /workspace-root/langtools-mcp
    command: uv run python -m langtools.mcp.main
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import langtools.mcp.server; print('OK')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3